<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamie Fish - Commande</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="home-body">
  <header style="background:white;color:#333;padding:20px;text-align:center;border-bottom:4px solid #e67e22">
    <img src="{{ url_for('static', filename='images/logo.png') }}" style="width:180px;border-radius:50%">
    <h1 style="color:#e67e22;margin:10px 0">Mamie Fish</h1>
    <p>Le goût de la maison, livré à Yaoundé - 30min</p>
  </header>

  <div class="card home-card">
    <h2>🐟 Mamie Fish - Commander</h2>
    <div id="menu"></div>
    <hr>
    <input id="client" placeholder="Ton nom">
    <input id="telephone" placeholder="Téléphone WhatsApp ex: 6XX XXX XXX">
    <input id="adresse" placeholder="Quartier / Adresse livraison">
    <select id="plat"></select>
    <input id="quantite" type="number" value="1" min="1">
    <button id="btn">Commander et Payer MoMo / OM</button>
    <p id="msg"></p>
  </div>

  <script>
    const MENU = {{ plats | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
